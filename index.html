<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Lahore Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css?v=r1e2d3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="background-overlay"></div>
    <main class="dashboard">
        <header class="header">
            <div class="location-box">
                <h1 id="city-name">LAHORE</h1>
                <p id="country-name">PAKISTAN</p>
            </div>
            <div class="time-box">
                <div id="clock">00:00:00</div>
                <div id="date">MONDAY, APRIL 13</div>
            </div>
        </header>

        <section class="main-weather">
            <div class="current-weather-card">
                <div class="weather-info">
                    <div class="temp-container">
                        <span id="current-temp">--</span><span class="unit">°C</span>
                    </div>
                    <div id="weather-condition" class="condition">LOADING...</div>
                </div>
                <div class="weather-visual">
                    <div id="weather-animation-container"></div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-label">HUMIDITY</span>
                    <span id="humidity" class="stat-value">--%</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">WIND SPEED</span>
                    <span id="wind-speed" class="stat-value">-- km/h</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">VISIBILITY</span>
                    <span id="visibility" class="stat-value">-- km</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">UV INDEX</span>
                    <span id="uv-index" class="stat-value">--</span>
                </div>
            </div>
        </section>

        <section class="chart-section">
            <h2 class="section-title">24-HOUR TEMPERATURE TREND</h2>
            <div class="chart-container">
                <canvas id="tempChart"></canvas>
            </div>
        </section>

        <section class="forecast-section">
            <h2 class="section-title">WEEKLY FORECAST</h2>
            <div id="forecast-container" class="forecast-grid">
                <!-- Forecast items will be injected here -->
            </div>
        </section>

        <footer class="footer">
            <div class="live-indicator">
                <span class="dot"></span> LIVE UPDATES
            </div>
            <div class="update-time">Last updated: <span id="last-updated">--</span></div>
        </footer>
    </main>

    <script src="script.js?v=r1e2d3"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('./sw.js')
                    .then(function (reg) { console.log('[PWA] SW registered:', reg.scope); })
                    .catch(function (err) { console.warn('[PWA] SW registration failed:', err); });
            });
        }
    </script>
</body>
</html>
