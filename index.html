<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skoop Notice Manager | CRUD Dashboard</title>
    <!-- Cache Control -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="styles.css?v=crud99">
</head>
<body>
    <div class="app-container">
        <!-- Background Layer -->
        <div class="background-image"></div>
        <div class="background-overlay"></div>

        <header class="main-header">
            <div class="logo-section">
                <div class="logo-box">S</div>
                <div class="logo-text">
                    <h1>SKOOP</h1>
                    <p>CONTENT MANAGER SYSTEM</p>
                </div>
            </div>
            <div class="header-stats">
                <div class="stat-item">
                    <span class="label">STATUS</span>
                    <span class="value active pulse">ONLINE</span>
                </div>
                <div class="stat-item clock-item">
                    <span id="current-time">00:00:00</span>
                </div>
            </div>
        </header>

        <main class="dashboard-grid">
            <!-- Form Section -->
            <section class="card form-card glass">
                <div class="card-header">
                    <i class="fas fa-edit"></i>
                    <h2 id="form-title">CREATE NEW ANNOUNCEMENT</h2>
                </div>
                <form id="notice-form">
                    <input type="hidden" id="notice-id">

                    <div class="form-group">
                        <label for="notice-title">NOTICE TITLE</label>
                        <input type="text" id="notice-title" placeholder="e.g. SYSTEM MAINTENANCE" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="notice-category">CATEGORY</label>
                            <select id="notice-category">
                                <option value="GENERAL">GENERAL</option>
                                <option value="URGENT">URGENT</option>
                                <option value="EVENT">EVENT</option>
                                <option value="MAINTENANCE">MAINTENANCE</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="notice-priority">PRIORITY</label>
                            <select id="notice-priority">
                                <option value="LOW">LOW</option>
                                <option value="NORMAL">NORMAL</option>
                                <option value="HIGH">HIGH</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="notice-content">CONTENT DESCRIPTION</label>
                        <textarea id="notice-content" rows="5" placeholder="Enter notice details here..." required></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="submit-btn" class="btn btn-primary">
                            <i class="fas fa-paper-plane"></i> PUBLISH NOTICE
                        </button>
                        <button type="button" id="cancel-btn" class="btn btn-secondary hidden">
                            <i class="fas fa-times"></i> CANCEL
                        </button>
                    </div>
                </form>
            </section>

            <!-- List Section -->
            <section class="card list-card glass">
                <div class="card-header">
                    <i class="fas fa-list-ul"></i>
                    <h2>ACTIVE NOTICES</h2>
                    <div class="counter-badge">
                        <span id="notice-count">0</span>
                    </div>
                </div>
                <div id="notice-list" class="notice-container">
                    <!-- Dynamic Items -->
                </div>
            </section>
        </main>

        <footer class="main-footer">
            <div class="ticker-box">
                <div class="ticker-label">LIVE UPDATES:</div>
                <div class="ticker-wrapper">
                    <div class="ticker">
                        CONTENT MANAGEMENT SYSTEM INITIALIZED... READY FOR INPUT... DATABASE CONNECTED... SKOOP AGENT MONITORING SYSTEM STATUS...
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script src="script.js?v=crud99"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js')
          .then(function (reg) { console.log('[PWA] SW registered:', reg.scope); })
          .catch(function (err) { console.warn('[PWA] SW registration failed:', err); });
      });
    }
  </script>
</body>
</html>
